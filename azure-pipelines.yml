trigger:
  branches:
    include: [main]

pool:
  vmImage: ubuntu-latest

jobs:
  - job: DeployADF
    displayName: 'Deploy ADF pipeline from adf_publish'
    steps:
      - checkout: self
        persistCredentials: 'true'

      - script: |
          git fetch origin adf_publish
          git worktree add ../adf_publish origin/adf_publish
        displayName: 'Fetch adf_publish branch'

      - task: AzureCLI@2
        displayName: 'az deployment group create'
        inputs:
          azureSubscription: 'retail-de-service-connection'
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
            az deployment group create \
              --resource-group rg-retail-de \
              --template-file ../adf_publish/adf-retail-de-dc/ARMTemplateForFactory.json \
              --parameters ../adf_publish/adf-retail-de-dc/ARMTemplateParametersForFactory.json

  - job: SyncDatabricksRepo
    displayName: 'Pull latest main into Databricks Repos'
    dependsOn: DeployADF
    steps:
      - task: AzureCLI@2
        displayName: 'databricks repos update'
        inputs:
          azureSubscription: 'retail-de-service-connection'
          useGlobalConfig: true 
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
            curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
            export PATH="$PATH:$HOME/.local/bin:$HOME/bin:/usr/local/bin"
            databricks --version

            export DATABRICKS_HOST="https://adb-7405615985153021.1.azuredatabricks.net"

            export DATABRICKS_AZURE_RESOURCE_ID="/subscriptions/$(az account show --query id -o tsv)/resourceGroups/rg-retail-de/providers/Microsoft.Databricks/workspaces/dbw-retail-de"
 
            REPO_ID=$(databricks repos list -o json | python3 -c "
            import sys, json
            data = json.load(sys.stdin)
            repos = data.get('repos', data) if isinstance(data, dict) else data
            print('Visible repos:', file=sys.stderr)
            for r in repos:
                print(f\"  {r.get('path')}\", file=sys.stderr)
            match = next((r for r in repos if r.get('path', '').endswith('/az-retail-pipe')), None)
            if match is None:
                print('ERROR: no repo path ending in /az-retail-pipe found', file=sys.stderr)
                sys.exit(1)
            print(match['id'])
            ")

            databricks repos update "$REPO_ID" --branch main